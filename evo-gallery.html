<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hình thái tiến hóa</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0f1612;
        --panel: #1a241c;
        --muted: #9aab9e;
        --line: #2e3c30;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(ellipse at 50% 0%, #1e3324 0%, var(--bg) 55%);
        color: #eef5ea;
        min-height: 100vh;
        padding: 24px 18px 48px;
      }
      h1 {
        margin: 0 0 6px;
        text-align: center;
        color: #ffe6a0;
        font-size: 28px;
      }
      .sub {
        text-align: center;
        color: var(--muted);
        margin: 0 0 28px;
        font-size: 14px;
      }
      .line {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px 18px 20px;
        margin: 0 auto 18px;
        max-width: 980px;
      }
      .line-head {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 10px 14px;
        margin-bottom: 14px;
      }
      .line-head h2 {
        margin: 0;
        font-size: 20px;
      }
      .tag {
        border: 1px solid;
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 12px;
        font-weight: 700;
      }
      .diet {
        color: var(--muted);
        font-size: 13px;
      }
      .forms {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 10px;
      }
      .form {
        background: linear-gradient(180deg, #243028, #17201a);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        text-align: center;
      }
      .form .sprite {
        height: 150px;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }
      .form img {
        width: auto;
        height: var(--sprite-h, 72px);
        object-fit: contain;
        image-rendering: pixelated;
        filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.45));
      }
      .form .title {
        margin-top: 8px;
        font-weight: 700;
        font-size: 15px;
      }
      .form .stage {
        color: var(--muted);
        font-size: 12px;
        margin-top: 2px;
      }
      .form .desc {
        color: #c5d3c8;
        font-size: 12px;
        line-height: 1.4;
        margin-top: 8px;
        min-height: 2.8em;
      }
      .stats {
        margin-top: 8px;
        font-size: 11px;
        color: var(--muted);
        display: grid;
        gap: 2px;
      }
      @media (max-width: 900px) {
        .forms { grid-template-columns: repeat(3, 1fr); }
      }
      @media (max-width: 560px) {
        .forms { grid-template-columns: 1fr 1fr; }
        .form img { height: 96px; }
      }
    </style>
  </head>
  <body>
    <h1>Hình thái tiến hóa</h1>
    <p class="sub">5 dạng: non → trưởng thành → tối thượng → khủng bố (đi 2 chân) → thần thoại (bay)</p>
    <div id="root"></div>
    <script type="module">
      import { SPECIES } from './src/data/species.ts';
      import { speciesPreviewUrl, setPreview3D } from './src/gfx/textures.ts';

      setPreview3D(true);
      const root = document.getElementById('root');
      /** Preview height grows with art.size so each evolution reads clearly bigger. */
      const spriteH = (size) => Math.round(48 + (size / 98) * 100);
      root.innerHTML = SPECIES.map((s) => {
        const forms = s.forms
          .map((f, i) => {
            const st = f.stats;
            const h = spriteH(f.art.size);
            return `<div class="form">
              <div class="sprite"><img style="--sprite-h:${h}px;height:${h}px" src="${speciesPreviewUrl(s.id, i, false)}" alt="${f.name}"></div>
              <div class="title">${f.name}</div>
              <div class="stage">Dạng ${i + 1} · ${f.title} · cỡ ${f.art.size}</div>
              <div class="desc">${f.desc}</div>
              <div class="stats">
                <div>Máu ${st.maxHp} · Tốc ${st.speed} · Lực ${st.power}</div>
                <div>Phòng ${st.defense} · Bền ${st.stamina} · Hitbox ${f.radius}</div>
              </div>
            </div>`;
          })
          .join('');
        return `<section class="line">
          <div class="line-head">
            <h2>${s.lineName}</h2>
            <span class="tag" style="border-color:${s.elementColor};color:${s.elementColor}">Hệ ${s.element}</span>
            <span class="diet">${s.dietLabel}</span>
          </div>
          <div class="forms">${forms}</div>
        </section>`;
      }).join('');
    </script>
  </body>
</html>
